plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.10'
  id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.castrelyx'
version = '0.1.0'

java {
  sourceCompatibility = JavaVersion.VERSION_21
  targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
  options.release = 21
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-jdbc'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.xerial:sqlite-jdbc:3.47.1.0'
  implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
  implementation 'org.bouncycastle:bcpkix-jdk18on:1.81'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
  useJUnitPlatform()
}

def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? ['cmd', '/c', 'npm'] : ['npm']
tasks.register('frontendInstall', Exec) {
  workingDir 'frontend'
  commandLine npmCommand + ['ci', '--no-audit', '--no-fund']
  inputs.files('frontend/package.json', 'frontend/package-lock.json')
  // Hash the installation marker, not every vendor font and source file.
  outputs.file('frontend/node_modules/.castrelsign-install-stamp')
  outputs.upToDateWhen { file('frontend/node_modules/vite/bin/vite.js').exists() }
  doLast { file('frontend/node_modules/.castrelsign-install-stamp').text = 'installed' }
}
tasks.register('frontendBuild', Exec) {
  dependsOn 'frontendInstall'
  workingDir 'frontend'
  commandLine npmCommand + ['run', 'build']
  inputs.dir('frontend/src')
  inputs.files('frontend/index.html', 'frontend/vite.config.js', 'frontend/package-lock.json')
  outputs.dir('frontend/dist')
}
tasks.named('processResources') {
  dependsOn 'frontendBuild'
  from('frontend/dist') { into 'static/console' }
}
