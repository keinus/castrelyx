plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.10'
	id 'io.spring.dependency-management' version '1.1.7'
	id "org.sonarqube" version "6.2.0.5505"
}

group = 'org.keinus'
version = '0.3.1'

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile) {
	options.release = 21
	options.compilerArgs << "-parameters"
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	// Internal repository (if needed):
	maven { 
		url "http://192.168.50.22:8081/repository/maven-central/" 
		allowInsecureProtocol = true
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-configuration-processor'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'io.krakens:java-grok:0.1.9'
	implementation 'org.yaml:snakeyaml:2.2'
	implementation 'org.snmp4j:snmp4j:3.9.5'

	implementation("org.apache.httpcomponents.client5:httpclient5")
	
	// Database dependencies for Phase 1.1
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.xerial:sqlite-jdbc:3.47.1.0'
	implementation 'org.hibernate.orm:hibernate-community-dialects:6.6.4.Final'
	implementation 'org.flywaydb:flyway-core:10.21.0'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
	implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.1'

	// AOP for auto-reload on configuration changes
	implementation 'org.springframework.boot:spring-boot-starter-aop'

	// Swagger/OpenAPI documentation
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.amqp:spring-rabbit-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testImplementation 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// The console has one React/shadcn entry point. Legacy source remains available
// for regression tests, but its independent shells are not shipped in the jar.
def skipFrontend = providers.gradleProperty('skipFrontend').map { it.toBoolean() }.getOrElse(false)
def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? ['cmd', '/c', 'npm'] : ['npm']

tasks.register('frontendInstall', Exec) {
	workingDir 'frontend'
	commandLine npmCommand + ['ci', '--no-audit', '--no-fund']
	inputs.files('frontend/package.json', 'frontend/package-lock.json')
	// npm writes this marker after installation. Snapshotting the entire dependency
	// tree makes Windows builds spend minutes hashing files before npm even starts.
	outputs.file('frontend/node_modules/.package-lock.json')
	outputs.upToDateWhen {
		file('frontend/node_modules/vite/package.json').exists() &&
		file('frontend/node_modules/typescript/package.json').exists()
	}
	onlyIf { !skipFrontend }
}

tasks.register('frontendBuild', Exec) {
	dependsOn 'frontendInstall'
	workingDir 'frontend'
	commandLine npmCommand + ['run', 'build']
	inputs.files(fileTree('frontend') { exclude 'node_modules/**', 'dist/**', '*.tsbuildinfo' })
	outputs.dir(layout.buildDirectory.dir('frontend'))
	onlyIf { !skipFrontend }
}

sourceSets.main.resources.exclude('static/index.html', 'static/index_legacy.html',
	'static/transform.html', 'static/markdown-viewer.html', 'static/favicon.svg',
	'static/js/**', 'static/css/**')

tasks.named('processResources') {
	dependsOn 'frontendBuild'
	from(layout.buildDirectory.dir('frontend')) { into 'static' }
	doFirst {
		if (!layout.buildDirectory.file('frontend/index.html').get().asFile.exists()) {
			throw new GradleException('Frontend bundle missing. Run npm ci && npm run build in frontend before using -PskipFrontend=true.')
		}
	}
}
